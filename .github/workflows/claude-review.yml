name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude Code Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The secrets context is not available to `if`, and fork PRs get no
      # secrets, so resolve availability here and gate the steps below on it.
      - name: Check for review credentials
        id: creds
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not available; skipping review."
          fi

      - name: Build review prompt
        id: build-prompt
        if: steps.creds.outputs.available == 'true'
        env:
          PROMPT_FILE: .github/prompts/review.md
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          ./.github/scripts/build-review-prompt.sh /tmp/prompt.txt

          DELIM="PROMPT_EOF_$(date +%s)"
          {
            echo "prompt<<${DELIM}"
            cat /tmp/prompt.txt
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"

      # Populated on main by warm-review-caches.yml and shared across PRs.
      - name: Restore Claude action dependencies
        if: steps.creds.outputs.available == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: claude-bun-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/claude-review.yml') }}
          restore-keys: |
            claude-bun-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Run Claude Code Review
        id: claude-review
        if: steps.creds.outputs.available == 'true'
        uses: anthropics/claude-code-action@8ce9314fa9a404564fa7e954cd84f25bcba2b829 # v1.0.236
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.build-prompt.outputs.prompt }}
          claude_args: --model claude-opus-5

      - name: Post review comment
        # Not always(): a run cancelled by a newer push must not post a
        # stale review or a failure stub.
        if: ${{ !cancelled() && steps.creds.outputs.available == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.event.pull_request.head.sha }}
          REVIEW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          ./.github/scripts/extract-claude-review.sh \
            "${{ steps.claude-review.outputs.execution_file }}" \
            /tmp/review.txt

          {
            echo "## Claude Code Review"
            echo ""
            if [ "${{ steps.claude-review.outcome }}" != "success" ]; then
              echo "**Review execution failed.**"
              echo ""
            fi
            cat /tmp/review.txt
            echo ""
            printf '\nReviewed commit [%s](%s) · [Workflow run](%s)\n' \
              "$REVIEW_HEAD_SHA" "$REVIEW_COMMIT_URL" "$REVIEW_RUN_URL"
            echo "<!-- claude-review -->"
          } > /tmp/review-comment.txt

          ./.github/scripts/post-pr-comment.sh \
            "${{ github.repository }}" \
            "${{ github.event.pull_request.number }}" \
            /tmp/review-comment.txt
